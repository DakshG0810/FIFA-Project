# One-click odds refresh — use after deploying the Betfair-exchange fix.
name: Collect odds only

on:
  workflow_dispatch:

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init database + purge invalid odds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from database import init_db; init_db()"

      - name: Collect Odds API
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -c "from collectors.odds import collect_odds; collect_odds()"

      - name: Verify valid bookmaker favourite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from database import get_connection, ph
          from odds_validate import latest_valid_capture, pick_bookmaker_favourite
          c = get_connection()
          cap = latest_valid_capture(c)
          if not cap:
              raise SystemExit('No valid odds snapshot after collection')
          p = ph()
          rows = c.execute(f'SELECT team, win_probability FROM odds_snapshots WHERE captured_at = {p}', (cap,)).fetchall()
          fav = pick_bookmaker_favourite({r['team']: r['win_probability'] for r in rows})
          c.close()
          print('Valid snapshot:', cap)
          print('Bookmaker favourite:', fav)
          if not fav or fav['team'] in ('DR Congo',):
              raise SystemExit('Bookmaker favourite still invalid')
          "
