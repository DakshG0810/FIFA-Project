# One-time Google Trends backfill from 2026-05-21 (run manually once).
# After this, daily-collect.yml continues normal collection.

name: Backfill Google Trends history

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init database tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from database import init_db; init_db()"

      - name: Backfill worldwide Trends from May 21
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRENDS_BACKFILL_START: "2026-05-21"
          PYTHONIOENCODING: utf-8
        run: python -c "from collectors.trends_backfill import backfill_worldwide_trends; backfill_worldwide_trends()"

      - name: Verify backfill wrote rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from database import get_connection
          c = get_connection()
          row = c.execute(\"\"\"
              SELECT COUNT(*) as n FROM trends_snapshots
              WHERE region = 'worldwide' AND substr(captured_at, 1, 10) >= '2026-05-21'
          \"\"\").fetchone()
          c.close()
          n = row['n'] if row else 0
          print(f'Worldwide trend rows since 2026-05-21: {n}')
          if n < 100:
              raise SystemExit(f'Backfill verification failed — only {n} rows found')
          "
