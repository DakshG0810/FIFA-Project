# Runs collectors once per day — free alternative to a paid Render worker.
# Add secrets in GitHub: Settings → Secrets and variables → Actions

name: Daily data collection

on:
  schedule:
    # 06:00 UTC every day (~11:30 IST / adjust as needed)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collectors (Bluesky + Trends + Odds)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_DEMO_FALLBACK: "false"
          PYTHONIOENCODING: utf-8
        run: python run_collect_once.py
