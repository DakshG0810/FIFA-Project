# Runs collectors once per day — free alternative to a paid Render worker.
# Add secrets in GitHub: Settings → Secrets and variables → Actions

name: Daily data collection

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init database tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from database import init_db; init_db()"

      - name: Collect Bluesky (sentiment, keywords, leaderboard)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_DEMO_FALLBACK: "false"
          PYTHONIOENCODING: utf-8
        run: python -c "from collectors.bluesky import collect_bluesky; collect_bluesky()"

      - name: Collect Google Trends
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python -c "from collectors.google_trends import collect_google_trends; collect_google_trends()"

      - name: Collect Odds API
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -c "from collectors.odds import collect_odds; collect_odds()"

      - name: Verify collection wrote to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from database import get_connection
          c = get_connection()
          row = c.execute(\"SELECT MAX(captured_at) as t FROM sentiment_snapshots WHERE source='bluesky'\").fetchone()
          c.close()
          print(f'Latest Bluesky snapshot: {row[\"t\"]}')
          if not row or not row['t']:
              raise SystemExit('No Bluesky data in database after collection')
          "
