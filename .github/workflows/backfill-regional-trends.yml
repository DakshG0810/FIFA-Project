# One-time regional Google Trends backfill for all heatmap countries.
# Populates per-country search interest immediately (expect 2–4 hours).

name: Backfill regional Google Trends

on:
  workflow_dispatch:
    inputs:
      geos_only:
        description: "Optional ISO codes (comma-separated, e.g. IN,US,GB). Leave empty for all countries."
        required: false
        default: ""

jobs:
  backfill-regional:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init database tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from database import init_db; init_db()"

      - name: Backfill regional Trends for all map countries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REGIONAL_GEOS: ${{ github.event.inputs.geos_only }}
          PYTHONIOENCODING: utf-8
        run: python -c "from collectors.regional_trends_backfill import backfill_regional_trends; backfill_regional_trends()"

      - name: Verify regional rows written
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          from database import get_connection
          c = get_connection()
          row = c.execute(\"\"\"
              SELECT COUNT(DISTINCT region) as n FROM trends_snapshots
              WHERE region != 'worldwide'
          \"\"\").fetchone()
          c.close()
          n = row['n'] if row else 0
          print(f'Distinct regional countries in DB: {n}')
          if n < 30:
              raise SystemExit(f'Regional verification failed — only {n} countries found')
          "
