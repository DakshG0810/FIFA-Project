# Render.com blueprint — PulseCup production
# Dashboard: https://dashboard.render.com → New → Blueprint
# Docs: docs/DEPLOY_RENDER.md

services:
  - type: web
    name: pulsecup-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulsecup-db
          property: connectionString
      - key: ENV
        value: production
      - key: COLLECT_INTERVAL_HOURS
        value: "24"
      - key: DATA_STALE_HOURS
        value: "30"
      - key: BLUESKY_DEMO_FALLBACK
        value: "false"
      - key: ODDS_API_KEY
        sync: false
      - key: BLUESKY_HANDLE
        sync: false
      - key: BLUESKY_APP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: worker
    name: pulsecup-collector
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduler.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulsecup-db
          property: connectionString
      - key: ENV
        value: production
      - key: COLLECT_INTERVAL_HOURS
        value: "24"
      - key: BLUESKY_DEMO_FALLBACK
        value: "false"
      - key: ODDS_API_KEY
        sync: false
      - key: BLUESKY_HANDLE
        sync: false
      - key: BLUESKY_APP_PASSWORD
        sync: false

databases:
  - name: pulsecup-db
    plan: free
